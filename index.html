<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<link rel="manifest" href="manifest.json">
<title>Route log</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d1f23; --muted:#5f6368; --blue:#1a73e8; --green:#188038;
          --orange:#b35900; --red:#c5221f; --line:#e1e4e8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121417; --card:#1d2024; --text:#e8eaed; --muted:#9aa0a6; --line:#2c3036; --blue:#8ab4f8;
            --green:#81c995; --orange:#fcad70; --red:#f28b82; --on-button:#0b1a2e; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         padding:12px 16px 40px; }
  h1 { font-size:18px; margin:4px 0 2px; }
  .muted { color:var(--muted); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
  .next .label { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  .next .name { font-size:22px; font-weight:700; margin:2px 0 6px; }
  .next .eta { font-size:16px; }
  .eta b { font-size:18px; }
  button.big { display:block; width:100%; border:0; border-radius:12px; padding:18px; font-size:20px; font-weight:700;
               color:var(--on-button, #fff); background:var(--blue); margin-top:12px; }  /* dark text on light dark-mode buttons: readable in sun */
  button.big.arrive { background:var(--green); }
  button.big.waze { background:#33ccff; color:#0b1a2e; }
  a { text-decoration:none; }
  button.small { border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px;
                 padding:10px 12px; font-size:15px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  ol { list-style:none; padding:0; margin:0; }
  li { border-top:1px solid var(--line); padding:10px 0; }
  li:first-child { border-top:0; }
  li.current { background:linear-gradient(90deg, rgba(26,115,232,.10), transparent); margin:0 -14px; padding:10px 14px; }
  .pt { font-weight:600; }
  .times { display:flex; gap:12px; flex-wrap:wrap; font-size:14px; color:var(--muted); margin-top:3px; }
  .t { color:var(--text); text-decoration:underline dotted; cursor:pointer; }
  .late { color:var(--red); } .early { color:var(--green); }
  .done { color:var(--green); font-weight:700; }
  .empty { text-align:center; padding:40px 10px; }
  .skipped { text-decoration:line-through; color:var(--muted); }
  button.big.reason { background:var(--line); color:var(--text); margin-top:8px; padding:14px; }
  button.small:disabled { opacity:.45; }
</style>
</head>
<body>
<div id="app"><p class="muted">Loading…</p></div>
<script>
// Route log (NatureGift Tools, 29.10.2026): the day's route comes inside this page's link (the part after '#',
// which browsers never send to a server). Times are kept only on this phone (localStorage) until 'Save results'.
// A point can be skipped; pauses (charging, fuel, lunch, WC) are logged apart - never counted as driving or stop time.
"use strict";
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const hm = (d) => d ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "";
const mins = (a, b) => Math.round((b - a) / 60000);
const REASONS = [["charging", "⚡ Charging"], ["fuel", "⛽ Fuel"], ["lunch", "🍽 Lunch"], ["wc", "🚻 WC"], ["other", "Other"]];
let route = null, state = null, key = "", frag = "", carried = null, choosing = false, hist = [];
const android = /Android/i.test(navigator.userAgent);

function canSendFiles() {  // Chrome: yes; Firefox and some others: no -> they can only download
  try { return !!(navigator.canShare && navigator.canShare({ files: [new File(["x"], "x.json", { type: "application/json" })] })); }
  catch (e) { return false; }
}

const b64url = (s) => btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");

// the same page in Chrome, everything logged so far going along (after a '.' in the link)
function chromeLink() {
  return "intent://" + location.host + location.pathname + "#" + frag + "." + b64url(JSON.stringify(state)) +
         "#Intent;scheme=https;package=com.android.chrome;end";
}

function marks(s) {
  return s.times.reduce((n, t) => n + (t.a ? 1 : 0) + (t.l ? 1 : 0) + (t.s ? 1 : 0), 0) + (s.pauses || []).length;
}

async function decode(fragment) {
  const b64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(b64 + "===".slice((b64.length + 3) % 4)), (c) => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

function save() {
  try { localStorage.setItem(key, JSON.stringify(state)); localStorage.setItem(key + ":h", JSON.stringify(hist)); }
  catch (e) {}
}

function fresh() { return { times: route.p.map(() => ({ a: null, l: null })), pauses: [] }; }

function load() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem(key) || "null"); hist = JSON.parse(localStorage.getItem(key + ":h") || "[]"); }
  catch (e) {}
  if (!(s && s.times)) s = null;
  if (carried && carried.times && carried.times.length === route.p.length && (!s || marks(carried) > marks(s))) {
    s = carried; hist = [];  // came over from Firefox
  }
  s = s || fresh();
  s.pauses = s.pauses || [];
  return s;
}

// every change can be undone, one step at a time
function change(fn) {
  hist.push(JSON.stringify(state));
  if (hist.length > 60) hist.shift();
  fn(); save(); render();
}

function undo() {
  if (!hist.length) return;
  state = JSON.parse(hist.pop()); save(); render();
}

const paused = () => { const p = state.pauses[state.pauses.length - 1]; return p && !p.e ? p : null; };

// the next thing to press: [point index, 'a' | 'l'] - the start is only left, the end only arrived at
function nextStep() {
  const n = route.p.length;
  for (let i = 0; i < n; i++) {
    const t = state.times[i];
    if (t.s) continue;
    if (i > 0 && !t.a) return [i, "a"];
    if (i < n - 1 && !t.l) return [i, "l"];
  }
  return null;
}

function eta(i) {  // when Google expects us at point i, from the last real time before it (skipped points: driven past)
  for (let j = i - 1; j >= 0; j--) {
    const t = state.times[j];
    if (t.s) continue;
    const from = t.l ? new Date(t.l) : (t.a ? new Date(new Date(t.a).getTime() + route.m * 60000) : null);
    if (from) {
      let total = 0;
      for (let k = j + 1; k <= i; k++) total += route.p[k][1] + (k < i && !state.times[k].s ? route.m : 0);
      const p = paused();
      const extra = p ? mins(new Date(p.s), new Date()) : 0;  // the pause so far pushes it on
      return new Date(from.getTime() + (total + extra) * 60000);
    }
  }
  return null;
}

function stamp(i, kind) { change(() => { state.times[i][kind] = new Date().toISOString(); }); }

function skip(i) {
  if (confirm("Skip " + route.p[i][0] + "? (not visited today)")) change(() => { state.times[i].s = true; });
}

function pause(reason) {
  choosing = false;
  change(() => state.pauses.push({ r: reason, s: new Date().toISOString(), e: null }));
}

function resume() { change(() => { paused().e = new Date().toISOString(); }); }

function edit(i, kind) {
  const t = state.times[i][kind];
  const now = t ? hm(new Date(t)) : hm(new Date());
  const v = prompt((kind === "a" ? "Arrived at " : "Left ") + route.p[i][0] + " (HH:MM, empty = clear):", now);
  if (v === null) return;
  if (!v.trim()) { change(() => { state.times[i][kind] = null; }); return; }
  const m = v.trim().match(/^(\d{1,2})[:.](\d{2})$/);
  if (!m) { alert("Write it like 14:35"); return; }
  const [y, mo, d] = route.d.split("-").map(Number);
  change(() => { state.times[i][kind] = new Date(y, mo - 1, d, +m[1], +m[2]).toISOString(); });
}

function results() {
  const points = route.p.map(([name, drive, planned], i) => {
    const t = state.times[i], p = { name, google_drive_min: drive, arrived: t.a, left: t.l };
    if (planned) p.planned = planned;
    if (t.s) p.skipped = true;
    return p;
  });
  const pauses = state.pauses.filter((p) => p.e).map((p) => ({ reason: p.r, start: p.s, end: p.e }));
  return { app: "NatureGift route log", version: 2, date: route.d, leave_planned: route.l, stop_min_planned: route.m,
           points, pauses, saved_at: new Date().toISOString() };
}

async function saveResults() {
  const text = JSON.stringify(results(), null, 1);
  const name = "route-" + route.d + ".json";
  const file = new File([text], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {  // Android: Gmail, Drive, ...
      await navigator.share({ files: [file], title: name });
      return;
    }
  } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a");  // else: download it
  a.href = URL.createObjectURL(file); a.download = name; a.click();
}

// Waze from wherever you are now to that point (user, 29.10.2026 - everyone here has Waze)
const waze = ([lat, lng]) => `https://waze.com/ul?ll=${lat},${lng}&navigate=yes`;

const reasonText = (r) => (REASONS.find((x) => x[0] === r) || [r, r])[1];

function render() {
  const n = route.p.length, step = nextStep(), p = paused();
  let html = `<h1>Route ${route.d.split("-").reverse().join(".")}</h1>
    <div class="muted">${n - 2} stops · planned leave ${route.l} · ${route.m} min per stop</div>`;
  if (p) {
    html += `<div class="card next"><div class="label">Paused</div>
      <div class="name">${reasonText(p.r)}</div>
      <div class="eta">since ${hm(new Date(p.s))} (${mins(new Date(p.s), new Date())} min) - not counted as driving</div>
      <button class="big arrive" id="resume">Continue</button></div>`;
  } else if (choosing) {
    html += `<div class="card next"><div class="label">Pause for</div>
      ${REASONS.map(([r, t]) => `<button class="big reason" data-r="${r}">${t}</button>`).join("")}
      <button class="small" id="nopause" style="margin-top:12px">Cancel</button></div>`;
  } else if (step) {
    const [i, kind] = step, name = route.p[i][0];
    let info = "";
    if (kind === "a") {
      const e = eta(i);
      info = `<div class="eta">Google: ${route.p[i][1]} min drive${e ? ` → about <b>${hm(e)}</b>` : ""}</div>`;
    } else if (i === 0) {
      info = `<div class="eta">Planned: ${route.l}</div>`;
    } else {
      const a = new Date(state.times[i].a);
      info = `<div class="eta">Here since ${hm(a)} (${mins(a, new Date())} min)</div>`;
    }
    html += `<div class="card next"><div class="label">${kind === "a" ? "Next" : (i === 0 ? "Start" : "Now at")}</div>
      <div class="name">${esc(name)}</div>${info}
      ${kind === "a" && route.p[i][3] ? `<a href="${waze(route.p[i][3])}" target="_blank" rel="noopener"><button class="big waze">Drive with Waze</button></a>` : ""}
      <button class="big ${kind === "a" ? "arrive" : ""}" id="go">${kind === "a" ? "Arrived" : "Leaving"}</button>
      ${kind === "a" && i < n - 1 ? `<button class="small" id="skip" style="margin-top:10px">Skip this one</button>` : ""}</div>`;
  } else {
    html += `<div class="card"><div class="done">Day done ✓</div>
      <div class="muted">Save the results - they go to the Route planner.</div></div>`;
  }
  if (android && !canSendFiles()) {
    html += `<div class="card"><div class="muted">This browser can only download the results - in Chrome
      'Save results' sends them to Gmail / Drive. Everything logged so far goes along.</div>
      <a href="${chromeLink()}"><button class="big">Open in Chrome</button></a></div>`;
  }
  html += `<div class="row">${!p && !choosing && step ? `<button class="small" id="pause">Pause…</button>` : ""}
    <button class="small" id="save">Save results</button>
    <button class="small" id="undo" ${hist.length ? "" : "disabled"}>Undo last</button></div><div class="card"><ol>`;
  route.p.forEach(([name, drive], i) => {
    const t = state.times[i], cur = step && step[0] === i;
    if (t.s) {
      html += `<li><div class="pt skipped">${i}. ${esc(name)}</div><div class="times">skipped</div></li>`;
      return;
    }
    let real = "";
    if (i > 0 && t.a && state.times[i - 1].l && !state.times[i - 1].s) {
      const d = mins(new Date(state.times[i - 1].l), new Date(t.a)) - pausedMin(state.times[i - 1].l, t.a), diff = d - drive;
      real = ` · real <span class="${diff > 3 ? "late" : diff < -3 ? "early" : ""}">${d} min</span>`;
    }
    const stay = t.a && t.l ? ` · stop ${mins(new Date(t.a), new Date(t.l)) - pausedMin(t.a, t.l)} min` : "";
    html += `<li class="${cur ? "current" : ""}"><div class="pt">${i === 0 ? "▶ " : i === n - 1 ? "■ " : i + ". "}${esc(name)}</div>
      <div class="times">${i > 0 ? `<span>Google ${drive} min${real}</span>` : ""}
      ${i > 0 ? `<span>arrived <span class="t" data-i="${i}" data-k="a">${t.a ? hm(new Date(t.a)) : "--:--"}</span></span>` : ""}
      ${i < n - 1 ? `<span>left <span class="t" data-i="${i}" data-k="l">${t.l ? hm(new Date(t.l)) : "--:--"}</span></span>` : ""}
      ${stay}</div></li>`;
  });
  html += "</ol></div>";
  const done = state.pauses.filter((x) => x.e);
  if (done.length) {
    html += `<div class="card"><div class="label muted">Pauses</div><ol>${done.map((x) =>
      `<li>${reasonText(x.r)} <span class="muted">${hm(new Date(x.s))}–${hm(new Date(x.e))} · ${mins(new Date(x.s), new Date(x.e))} min</span></li>`).join("")}</ol></div>`;
  }
  $("#app").innerHTML = html;
  if ($("#go")) $("#go").onclick = () => stamp(step[0], step[1]);
  if ($("#skip")) $("#skip").onclick = () => skip(step[0]);
  if ($("#pause")) $("#pause").onclick = () => { choosing = true; render(); };
  if ($("#nopause")) $("#nopause").onclick = () => { choosing = false; render(); };
  if ($("#resume")) $("#resume").onclick = resume;
  document.querySelectorAll(".reason").forEach((el) => el.onclick = () => pause(el.dataset.r));
  $("#save").onclick = saveResults;
  $("#undo").onclick = () => { if (confirm("Undo the last step?")) undo(); };
  document.querySelectorAll(".t").forEach((el) => el.onclick = () => edit(+el.dataset.i, el.dataset.k));
}

function pausedMin(a, b) {  // minutes of the pauses between two times
  const A = new Date(a).getTime(), B = new Date(b).getTime();
  return Math.round(state.pauses.filter((p) => p.e).reduce((s, p) =>
    s + Math.max(0, Math.min(B, new Date(p.e).getTime()) - Math.max(A, new Date(p.s).getTime())), 0) / 60000);
}

function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

window.addEventListener("hashchange", () => location.reload());  // a new route's link opened over the old one
setInterval(() => { if (state && (paused() || nextStep())) render(); }, 60000);  // the minutes shown keep up

(async function start() {
  const parts = location.hash.slice(1).split(".");
  frag = parts[0];
  if (parts[1]) {
    try {
      const c = JSON.parse(atob(parts[1].replace(/-/g, "+").replace(/_/g, "/")));
      carried = Array.isArray(c) ? { times: c, pauses: [] } : c;  // (the first version carried only the times)
    } catch (e) { carried = null; }
  }
  if (!frag) {
    $("#app").innerHTML = `<div class="empty"><h1>Route log</h1><p class="muted">Open it from the QR code
      'Log real times' in the Route planner (NatureGift Tools).</p></div>`;
    return;
  }
  try { route = await decode(frag); } catch (e) {
    $("#app").innerHTML = `<div class="empty"><h1>Route log</h1><p class="muted">This link can't be read -
      scan the QR code again.</p></div>`;
    return;
  }
  key = "routelog:" + route.d + ":" + frag.slice(0, 40);
  state = load();
  render();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
